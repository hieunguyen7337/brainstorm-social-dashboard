app = "pulse-hackathon"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_BASE_URL = "https://pulse-hackathon.fly.dev"
  APP_NAME = "Pulse"

[[mounts]]
  source = "pulse_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
