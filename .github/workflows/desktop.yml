name: Desktop
on:
  push:
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/mobile/**"
      - ".github/workflows/desktop.yml"
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: pulse-desktop-mac
            files: |
              apps/desktop/release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: pulse-desktop-win
            files: apps/desktop/release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install mobile
        working-directory: apps/mobile
        run: npm ci
      - name: Install desktop
        working-directory: apps/desktop
        run: npm ci
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Test
        working-directory: apps/desktop
        run: npm test
      - name: Export renderer
        working-directory: apps/desktop
        env:
          EXPO_PUBLIC_API_URL: ""
        run: npm run renderer
      - name: Package
        working-directory: apps/desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
