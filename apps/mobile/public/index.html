<!DOCTYPE html>
<!--
  HTML template for the web export. app.config.ts uses web.output "single" (an SPA the API serves with an
  index.html fallback); in that mode Expo ignores app/+html.tsx and builds index.html from this file.
  Expo fills in the language and title tokens below (first occurrence of each, so never mention them in comments),
  adds theme-color, description and the favicon from web.* in app.config.ts, and appends the bundle script.
  Keep the head tags and CSS in sync with app/+html.tsx (used only if the output mode is ever switched to "static").
-->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style id="expo-reset">#root,body,html{height:100%}body{overflow:hidden}#root{display:flex}</style>
    <style>
      html, body, #root { height: 100%; }
      html, body {
        background-color: #0b1020;
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      body {
        color: #f4f6ff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif,
          'Apple Color Emoji', 'Segoe UI Emoji';
      }
      /* iOS Safari zooms the page when a focused field is under 16px; keep every touch-device field at 16px. */
      @media (pointer: coarse) {
        input, textarea, select { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
