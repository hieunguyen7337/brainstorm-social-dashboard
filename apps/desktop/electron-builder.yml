appId: com.pulse.desktop
productName: Pulse
copyright: Pulse
asar: true
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - renderer/**
  - package.json
  - "!**/*.map"
afterPack: scripts/after-pack.cjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  identity: null # no Developer ID: scripts/after-pack.cjs applies an ad-hoc signature instead
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  sign: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
artifactName: Pulse-${version}-${os}-${arch}.${ext}
